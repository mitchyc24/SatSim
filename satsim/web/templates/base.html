<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SatSim{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('web.static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('web.index') }}">
        <span class="brand-mark">&#9679;</span> SatSim
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('web.index') }}">Scenarios</a>
        <a href="{{ url_for('api.list_scenarios') }}">API</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer container">
    SatSim &mdash; satellite constellation viability analysis
  </footer>
</body>
</html>
