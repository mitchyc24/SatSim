{% extends "base.html" %}
{% block title %}3D View – {{ scenario.name }}{% endblock %}

{% block content %}
<div class="viz-header">
  <h1>3D Visualization: {{ scenario.name }}</h1>
  <p>
    <a href="{{ url_for('web.scenario_detail', scenario_id=scenario.id) }}">&larr; Back to scenario</a>
  </p>
  <div class="viz-legend">
    <span class="legend-item"><span class="legend-dot" style="background:#00ccff;"></span> Satellites</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ff4444;"></span> Ground Stations</span>
    <span class="legend-item"><span class="legend-line" style="border-color:#ffcc00;"></span> Link (visible pass)</span>
  </div>
</div>
<div id="viz-container" style="width:100%;height:600px;position:relative;background:#000;border-radius:8px;overflow:hidden;">
  <div id="viz-loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:1.2em;">Loading 3D scene&hellip;</div>
</div>
<div class="viz-controls" style="margin-top:1em;">
  <label><input type="checkbox" id="chk-orbits" checked> Show orbits</label>
  <label><input type="checkbox" id="chk-links" checked> Show links</label>
  <label>Speed: <input type="range" id="speed-slider" min="0" max="100" value="50"></label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('web.static', filename='visualization.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    SatSimViz.init('viz-container', {{ scenario.id }});
  });
</script>
{% endblock %}
